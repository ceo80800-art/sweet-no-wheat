  <main>
    <section class="contact-container">
      <h2>Contact Us</h2>
      <form method="post" action="http://ss1.ciwcertified.com/cgi-bin/process.php">
        <label for="name">Enter Your Name:</label>
        <input type="text" id="name" name="Name" size="40" required>

        <label for="email">Enter Your Email:</label>
        <input type="email" id="email" name="Email" size="40" required>

        <label for="message">Message:</label>
        <textarea id="message" name="Message" placeholder="Type your message here..." required></textarea>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 Sweet! No Wheat | <a href="https://sweetnowheat.com">sweetnowheat.com</a></p>
  </footer>
